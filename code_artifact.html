    const MZ_TOASTS = [
      { hanzi: "酒杯一碰，黄金乱蹦！", pinyin: "Jiǔbēi yí pèng, huángjīn luàn bèng!", meaning: "술잔을 딱 부딪치니 황금이 와르르 튄다!", tag: "MZ 대세 라임" },

    function App() {
      const [currentScenarioIdx, setCurrentScenarioIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [remainingSeconds, setRemainingSeconds] = useState(600);
      const [trainingPhase, setTrainingPhase] = useState(0); 
      const [activeSentenceIdx, setActiveSentenceIdx] = useState(0);
      const [userSpeakingCount, setUserSpeakingCount] = useState(0);
      const [audioSpeed, setAudioSpeed] = useState(0.85);
      const [showToastModal, setShowToastModal] = useState(false);
      const [copiedToast, setCopiedToast] = useState("");

      const activeScenario = SCENARIOS[currentScenarioIdx];
      const timerRef = useRef(null);
      const autoPlayTimeoutRef = useRef(null);

      // Clipboard Copy Helper (works safely in iFrames and WebViews)
      const copyToClipboard = (text, label = "문장이 복사되었습니다") => {
        try {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.left = "-9999px";
          textArea.style.top = "-9999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          const successful = document.execCommand("copy");
          document.body.removeChild(textArea);
          
          if (successful) {
            setCopiedToast(label);
            setTimeout(() => setCopiedToast(""), 2000);
            return;
          }
        } catch (err) {
          console.error("execCommand fallback failed", err);
        }

        // Modern clipboard fallback
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            setCopiedToast(label);
            setTimeout(() => setCopiedToast(""), 2000);
          }).catch(() => {
            setCopiedToast("복사에 실패했습니다.");
            setTimeout(() => setCopiedToast(""), 2000);
          });
        }
      };

      // Copy whole active scenario dialogue
      const copyAllDialogue = () => {
        const fullText = activeScenario.dialogue.map(
          (d) => `[${d.speaker}]\n${d.hanzi}\n${d.pinyin}\n${d.meaning}`
        ).join("\n\n");
        copyToClipboard(fullText, "전체 대화 4문장이 복사되었습니다");
      };

      // Play Speech Synthesizer (TTS)
      const playTTS = (text, rate = audioSpeed) => {
        return new Promise((resolve) => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = rate;
            utterance.onend = () => resolve();
            utterance.onerror = () => resolve();
            window.speechSynthesis.speak(utterance);
          } else {
            setTimeout(resolve, 2000);
          }
        });
      };

      // 10-Minute Main Countdown Timer
      useEffect(() => {
        if (isPlaying && remainingSeconds > 0) {
          timerRef.current = setInterval(() => {
            setRemainingSeconds((prev) => {
              if (prev <= 1) {
                setIsPlaying(false);
                clearInterval(timerRef.current);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isPlaying, remainingSeconds]);

      // Automated Hands-free Learning Sequence Engine
      useEffect(() => {
        if (!isPlaying) {
          window.speechSynthesis && window.speechSynthesis.cancel();
          clearTimeout(autoPlayTimeoutRef.current);
          return;
        }

        let isCancelled = false;

        const runAutomation = async () => {
          const sentences = activeScenario.dialogue;

          // -----------------------------------------------------------------
          // PHASE 0: 4문장 연속 대화 통으로 듣기 (전체 호흡 익히기)
          // -----------------------------------------------------------------
          if (trainingPhase === 0) {
            for (let i = 0; i < sentences.length; i++) {
              if (isCancelled || !isPlaying) return;
              setActiveSentenceIdx(i);
              await playTTS(sentences[i].hanzi, 0.9);
              await new Promise(r => setTimeout(r, 1200));
            }
            if (isCancelled || !isPlaying) return;
            // Phase 1으로 자동 전환
            setTrainingPhase(1);
            setActiveSentenceIdx(0);
          }

          // -----------------------------------------------------------------
          // PHASE 1: 한 문장씩 듣고 따라하기 (입 풀기 섀도잉)
          // -----------------------------------------------------------------
          else if (trainingPhase === 1) {
            for (let i = 0; i < sentences.length; i++) {
              if (isCancelled || !isPlaying) return;
              setActiveSentenceIdx(i);

              // 1. AI 천천히 시범 발음 (0.75x)
              await playTTS(sentences[i].hanzi, 0.75);
              if (isCancelled || !isPlaying) return;

              // 2. "따라 말해보세요" 3초 타이머 카운트다운
              for (let count = 3; count >= 1; count--) {
                if (isCancelled || !isPlaying) return;
                setUserSpeakingCount(count);
                await new Promise(r => setTimeout(r, 1000));
              }
              setUserSpeakingCount(0);

              // 3. 확인용 보통 속도 1회 더
              await playTTS(sentences[i].hanzi, 0.95);
              await new Promise(r => setTimeout(r, 1400));
            }
            if (isCancelled || !isPlaying) return;
            // Phase 2로 자동 전환
            setTrainingPhase(2);
            setActiveSentenceIdx(0);
          }

          // -----------------------------------------------------------------
          // PHASE 2: 실전 핑퐁 대화 롤플레잉 (실제 상황 시뮬레이션)
          // -----------------------------------------------------------------
          else if (trainingPhase === 2) {
            for (let i = 0; i < sentences.length; i++) {
              if (isCancelled || !isPlaying) return;
              setActiveSentenceIdx(i);

              if (sentences[i].speaker === "나") {
                // 사용자가 말할 차례
                for (let count = 3; count >= 1; count--) {
                  if (isCancelled || !isPlaying) return;
                  setUserSpeakingCount(count);
                  await new Promise(r => setTimeout(r, 1000));
                }
                setUserSpeakingCount(0);
                await playTTS(sentences[i].hanzi, 0.9);
              } else {
                // 상대방이 말함
                await playTTS(sentences[i].hanzi, 0.9);
              }
              await new Promise(r => setTimeout(r, 1500));
            }
            if (isCancelled || !isPlaying) return;
            // Phase 3: 마무리 요약 완료
            setTrainingPhase(3);
          }

          // -----------------------------------------------------------------
          // PHASE 3: 완료 ➔ 다음 상황으로 자동 루프 진행 (10분 채우기)
          // -----------------------------------------------------------------
          else if (trainingPhase === 3) {
            await new Promise(r => setTimeout(r, 3000));
            if (isCancelled || !isPlaying) return;
            // 다음 상황으로 이동
            setCurrentScenarioIdx((prev) => (prev + 1) % SCENARIOS.length);
            setTrainingPhase(0);
            setActiveSentenceIdx(0);
          }
        };

        runAutomation();

        return () => {
          isCancelled = true;
          window.speechSynthesis && window.speechSynthesis.cancel();
          clearTimeout(autoPlayTimeoutRef.current);
        };
      }, [isPlaying, trainingPhase, currentScenarioIdx]);

      // Format seconds to MM:SS
      const formatTime = (secs) => {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const handlePlayToggle = () => {
        setIsPlaying(!isPlaying);
      };

      const handleReset = () => {
        setIsPlaying(false);
        setRemainingSeconds(600);
        setTrainingPhase(0);
        setActiveSentenceIdx(0);
        setUserSpeakingCount(0);
        window.speechSynthesis && window.speechSynthesis.cancel();
      };

                <div className="flex items-center gap-1.5">

                </div>
                <h1 className="text-sm font-bold text-slate-100 leading-tight">창춘 10분 중국어 회화</h1>

            </div>
            
            <button

              <span>🥂</span>

              {/* Minimal Progress Line */}
              <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mb-3">
                <div 
                  className="bg-sky-500 h-full transition-all duration-1000 ease-linear rounded-full"
                  style={{ width: `${progressPercent}%` }}
                />
              </div>

              {/* Current Context Meta */}
              <div className="bg-slate-950/70 p-3 rounded-xl border border-slate-800/80 mb-3 flex items-center justify-between">
                <div>
                  <div className="text-[11px] text-slate-400 font-medium">{activeScenario.place}</div>
                  <div className="text-sm font-bold text-slate-100 mt-0.5">{activeScenario.title}</div>
                </div>
                <span className="text-[11px] font-semibold px-2.5 py-1 rounded-lg bg-slate-800 text-sky-300 border border-slate-700">
                  {trainingPhase === 0 && "1단계: 통으로 듣기"}
                  {trainingPhase === 1 && "2단계: 섀도잉 발화"}
                  {trainingPhase === 2 && "3단계: 실전 롤플레잉"}
                  {trainingPhase === 3 && "4단계: 완주 성공"}
                </span>
              </div>

              {/* Play & Reset Controller */}
              <div className="flex gap-2">
                <button
                  onClick={handlePlayToggle}
                  className={`flex-1 py-3 px-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all active:scale-[0.99] ${
                    isPlaying
                      ? 'bg-amber-500 text-slate-950 hover:bg-amber-400'
                      : 'bg-sky-500 hover:bg-sky-400 text-white shadow-md shadow-sky-500/20'
                  }`}
                >
                  {isPlaying ? (
                    <>
                      <PauseIcon className="w-4 h-4" />
                      <span>일시 정지</span>
                    </>
                  ) : (
                    <>
                      <PlayIcon className="w-4 h-4" />
                      <span>▶ 10분 자동 트레이닝 시작</span>
                    </>
                  )}
                </button>

                <button
                  onClick={handleReset}
                  className="p-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition-all border border-slate-700"
                  title="처음부터 다시"
                >
                  <RotateCcwIcon className="w-4 h-4" />
                </button>
              </div>

              {/* Speed Controller & Global Copy */}
              <div className="flex items-center justify-between text-xs text-slate-400 mt-3 pt-3 border-t border-slate-800/80">
                <button
                  onClick={copyAllDialogue}
                  className="flex items-center gap-1.5 text-slate-300 hover:text-sky-300 transition-colors py-1 px-2 rounded-lg bg-slate-800/70 border border-slate-700/60 font-medium"
                >
                  <CopyIcon className="w-3.5 h-3.5 text-slate-400" />
                  <span>대화 4문장 전체 복사</span>
                </button>

                <div className="flex items-center gap-1.5">
                  <span className="text-[11px] text-slate-400">속도:</span>
                  {[0.75, 0.85, 1.0].map((rate) => (
                    <button
                      key={rate}
                      onClick={() => setAudioSpeed(rate)}
                      className={`px-2 py-0.5 rounded-md text-[11px] font-semibold transition-all ${
                        audioSpeed === rate 
                          ? 'bg-sky-500 text-white' 
                          : 'bg-slate-800 text-slate-400 hover:text-white'
                      }`}
                    >
                      {rate === 0.75 ? "0.75x" : rate === 0.85 ? "0.85x" : "1.0x"}
                    </button>
                  ))}
                </div>
              </div>

            </div>
          </div>

          {/* Dialogue Section with Individual Copy Action */}
          <div className="px-4 flex-1 flex flex-col">
            <div className="flex items-center justify-between text-xs text-slate-400 mb-2 px-1">
              <span className="font-semibold text-slate-300">실전 4문장 순차 대화</span>
              <span className="text-[11px] text-sky-400 font-medium">
                {activeSentenceIdx + 1} / 4 문장
              </span>
            </div>

            <div className="flex flex-col gap-2.5">
              {activeScenario.dialogue.map((item, idx) => {
                const isCurrent = activeSentenceIdx === idx && isPlaying;
                const isUser = item.speaker === "나";

                return (
                  <div
                    key={idx}
                    onClick={() => {
                      setActiveSentenceIdx(idx);
                      playTTS(item.hanzi);
                    }}
                    className={`p-3.5 rounded-xl border transition-all cursor-pointer relative overflow-hidden ${
                      isCurrent
                        ? isUser
                          ? 'bg-sky-950/50 border-sky-500 shadow-md shadow-sky-500/10'
                          : 'bg-emerald-950/50 border-emerald-500 shadow-md shadow-emerald-500/10'
                        : 'bg-slate-900/80 border-slate-800 hover:border-slate-700'
                    }`}
                  >
                    {/* Left Accent Bar */}
                    {isCurrent && (
                      <div className={`absolute left-0 top-0 bottom-0 w-1 ${isUser ? 'bg-sky-400' : 'bg-emerald-400'}`} />
                    )}

                    <div className="flex items-center justify-between mb-1.5 pl-0.5">
                      <div className="flex items-center gap-2">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${
                          isUser 
                            ? 'bg-sky-500 text-white' 
                            : 'bg-emerald-600 text-white'
                        }`}>
                          {item.speaker}
                        </span>
                        {isCurrent && (
                          <span className="text-[11px] font-semibold text-amber-400 flex items-center gap-1 animate-pulse">
                            <VolumeIcon className="w-3.5 h-3.5" /> 재생 중
                          </span>
                        )}
                      </div>

                      {/* Action Buttons: Copy & Play */}
                      <div className="flex items-center gap-1">
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            copyToClipboard(
                              `${item.hanzi}\n${item.pinyin}\n(${item.meaning})`,
                              `"${item.hanzi}" 문장이 복사되었습니다`
                            );
                          }}
                          className="text-slate-400 hover:text-sky-300 p-1 rounded-md hover:bg-slate-800 transition-colors"
                          title="문장 복사하기"
                        >
                          <CopyIcon className="w-3.5 h-3.5" />
                        </button>
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            playTTS(item.hanzi);
                          }}
                          className="text-slate-400 hover:text-white p-1 rounded-md hover:bg-slate-800 transition-colors"
                          title="원어민 발음 듣기"
                        >
                          <VolumeIcon className="w-4 h-4" />
                        </button>
                      </div>
                    </div>

                    {/* Sentence Texts */}
                    <div className="pl-0.5 select-text">
                      <div className="text-[11px] text-sky-400 font-mono tracking-tight leading-relaxed">
                        {item.pinyin}
                      </div>
                      <div className="text-base font-semibold text-slate-100 mt-0.5 leading-snug tracking-wide">
                        {item.hanzi}
                      </div>
                      <div className="text-xs text-slate-400 mt-1 leading-relaxed">
                        {item.meaning}
                      </div>
                    </div>

                    {/* Speaking Countdown Overlay */}
                    {isCurrent && userSpeakingCount > 0 && (
                      <div className="mt-2.5 pt-2 border-t border-slate-800 flex items-center justify-between bg-slate-950/70 p-2 rounded-lg">
                        <span className="text-xs font-semibold text-amber-300 flex items-center gap-1.5">
                          <span>🎙️</span>
                          <span>소리 내어 따라 말하세요!</span>
                        </span>
                        <span className="w-6 h-6 rounded-full bg-amber-400 text-slate-950 font-black text-xs flex items-center justify-center">
                          {userSpeakingCount}
                        </span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Field Etiquette Notes */}
            <div className="mt-4 p-3.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-300 flex flex-col gap-1.5">
              <div className="font-bold text-slate-100 flex items-center gap-1.5">
                <SparklesIcon className="w-3.5 h-3.5 text-amber-400" />
                현장 비즈니스 핵심 포인트
              </div>
              <p className="leading-relaxed text-slate-400 select-text">{activeScenario.tips}</p>
            </div>

          </div>

          {/* MZ Toast Modal Dialog */}
          {showToastModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-5 shadow-2xl flex flex-col gap-4 animate-subtle">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">🎉</span>
                    <h3 className="text-sm font-bold text-slate-100">중국 MZ 인기 건배사</h3>
                  </div>
                  <button
                    onClick={() => setShowToastModal(false)}
                    className="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center text-xs font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex flex-col gap-2.5 max-h-[380px] overflow-y-auto no-scrollbar">
                  {MZ_TOASTS.map((toast, i) => (
                    <div
                      key={i}
                      className="bg-slate-950 p-3 rounded-xl border border-slate-800 hover:border-slate-700 transition-all flex flex-col gap-1"
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-bold text-amber-400 bg-amber-950/50 px-2 py-0.5 rounded border border-amber-800/40">
                          {toast.tag}
                        </span>
                        <div className="flex items-center gap-1">
                          <button
                            onClick={() => copyToClipboard(
                              `${toast.hanzi} (${toast.pinyin}) - ${toast.meaning}`,
                              `"${toast.hanzi}" 건배사가 복사되었습니다`
                            )}
                            className="p-1 text-slate-400 hover:text-sky-300 rounded"
                            title="복사하기"
                          >
                            <CopyIcon className="w-3.5 h-3.5" />
                          </button>
                          <button
                            onClick={() => playTTS(toast.hanzi)}
                            className="p-1 text-slate-400 hover:text-white rounded"
                            title="발음 듣기"
                          >
                            <VolumeIcon className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                      <div className="text-sm font-bold text-slate-100 mt-0.5 select-text">{toast.hanzi}</div>
                      <div className="text-xs text-sky-400 font-mono select-text">{toast.pinyin}</div>
                      <div className="text-xs text-slate-400 select-text">{toast.meaning}</div>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => setShowToastModal(false)}
                  className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl text-xs transition-colors"
                >
                  닫기
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
